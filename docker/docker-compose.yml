# Full AML Investigation Agentic Platform stack.
#
# Quick start (from the repo root):
#     cp docker/.env.example docker/.env
#     # edit docker/.env to set GOOGLE_API_KEY at minimum
#     docker compose -f docker/docker-compose.yml --env-file docker/.env up --build
#
# Frontend + remote A2A agents (see README "Frontend with A2A"):
#     docker compose -f docker/docker-compose.yml \
#       --env-file docker/.env --env-file docker/.env.a2a \
#       --profile a2a up --build
#     # → http://localhost:8080 (frontend) · aml-host :8100 · stage cards :8101–:8104
#
# Services:
#   * postgres   pgvector/pg16 — both the RAG `documents` table and the
#                `aml.*` schema, initialized once on first boot from the
#                bind-mounted .sql files in docker/init-db/.
#   * neo4j      Investigation graph (constraints applied by neo4j-init).
#   * backend    FastAPI + the four-agent orchestrator (uvicorn).
#   * frontend   Vite-built React SPA served by nginx; nginx also proxies
#                /api/* → backend over the compose network.
#   * redis      Optional cache (profile: cache).
#
# Profiles:
#     docker compose --profile cache  up   # also runs redis
#     docker compose --profile a2a up    # four remote A2A stage hosts + backend A2A env
#
# Networks:
#   Everything sits on the default `aml-net` bridge so services resolve each
#   other by container name (e.g. `backend`, `postgres`, `neo4j`).

name: aml-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      IVFFLAT_LISTS: ${IVFFLAT_LISTS:-100}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aml-pgdata:/var/lib/postgresql/data
      # Schema bootstrap.  The .sh wrappers run on first init only (when the
      # data dir is empty); they call psql against POSTGRES_DB.
      - ./init-db/01-rag-schema.sh:/docker-entrypoint-initdb.d/01-rag-schema.sh:ro
      - ./init-db/02-aml-schema.sh:/docker-entrypoint-initdb.d/02-aml-schema.sh:ro
      # The .sql sources live elsewhere in the repo; surface them under /sql
      # so the init scripts can read them with stable paths.
      - ../agents/rag_agent/db/schema.sql:/sql/rag-schema.sql:ro
      - ../backend/aml/db/schema.sql:/sql/aml-schema.sql:ro
      - ../backend/aml/db/schema_case_scenarios_transactions.sql:/sql/aml-case-scenarios-txns.sql:ro
      - ../backend/aml/db/schema_services_swift.sql:/sql/aml-services-swift.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aml-net]

  neo4j:
    image: neo4j:5.20-community
    container_name: aml-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jpass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP:-512m}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # browser
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # bolt
    volumes:
      - aml-neo4jdata:/data
      - aml-neo4jlogs:/logs
    healthcheck:
      # cypher-shell ships in the image; a trivial RETURN proves the DB is up.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [aml-net]

  # One-shot job: applies the constraints in init-neo4j/ then exits 0.  Compose
  # restarts it cleanly on `up` even after the data dir is populated; the
  # IF NOT EXISTS guards make every re-run a no-op.
  neo4j-init:
    image: neo4j:5.20-community
    container_name: aml-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jpass}
    volumes:
      - ./init-neo4j:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        password="$${NEO4J_AUTH#*/}"
        for f in /init/*.cypher; do
          echo "[neo4j-init] applying $$f"
          cypher-shell -a bolt://neo4j:7687 -u neo4j -p "$$password" --file "$$f"
        done
        echo "[neo4j-init] done"
    restart: "no"
    networks: [aml-net]

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: aml/backend:dev
    container_name: aml-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # Database (asyncpg pool) -------------------------------------------------
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-2}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
      # Gemini ----------------------------------------------------------------
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      # Neo4j -----------------------------------------------------------------
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jpass}
      # API + observability --------------------------------------------------
      AML_CORS_ORIGINS: ${AML_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # Requeue RUNNING rows only after this many minutes (LLM steps can be slow).
      AML_STALE_RUNNING_MINUTES: ${AML_STALE_RUNNING_MINUTES:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Agent transport (default in_process; enable per-stage A2A with profile `a2a`)
      AML_AGENT_TRANSPORT_DEFAULT: ${AML_AGENT_TRANSPORT_DEFAULT:-in_process}
      AML_AGENT_TRANSPORT_INITIAL_ASSESSMENT: ${AML_AGENT_TRANSPORT_INITIAL_ASSESSMENT:-in_process}
      AML_AGENT_TRANSPORT_TRANSACTION_ENRICHMENT: ${AML_AGENT_TRANSPORT_TRANSACTION_ENRICHMENT:-in_process}
      AML_AGENT_TRANSPORT_DUE_DILIGENCE: ${AML_AGENT_TRANSPORT_DUE_DILIGENCE:-in_process}
      AML_AGENT_TRANSPORT_CASE_ANALYSIS: ${AML_AGENT_TRANSPORT_CASE_ANALYSIS:-in_process}
      AML_A2A_INITIAL_ASSESSMENT_URL: ${AML_A2A_INITIAL_ASSESSMENT_URL:-}
      AML_A2A_TRANSACTION_ENRICHMENT_URL: ${AML_A2A_TRANSACTION_ENRICHMENT_URL:-}
      AML_A2A_DUE_DILIGENCE_URL: ${AML_A2A_DUE_DILIGENCE_URL:-}
      AML_A2A_CASE_ANALYSIS_URL: ${AML_A2A_CASE_ANALYSIS_URL:-}
      AML_A2A_TIMEOUT_SECONDS: ${AML_A2A_TIMEOUT_SECONDS:-600}
      AML_TOOL_GATEWAY_SECRET: ${AML_TOOL_GATEWAY_SECRET:-aml-dev-tool-gateway-secret}
      AML_TOOL_GATEWAY_BASE_URL: ${AML_TOOL_GATEWAY_BASE_URL:-http://backend:8000}
      AML_TOOL_GATEWAY_TTL_SECONDS: ${AML_TOOL_GATEWAY_TTL_SECONDS:-3600}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [aml-net]

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Empty → SPA emits requests to /api/*, nginx proxies to backend.
        VITE_API_BASE_URL: ""
        VITE_A2A_BASE_URL: /a2a
        VITE_AML_AGENT_CHAT_ENABLED: "true"
    image: aml/frontend:dev
    container_name: aml-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [aml-net]

  redis:
    image: redis:7-alpine
    container_name: aml-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles: ["cache"]
    networks: [aml-net]

  # Shared A2A stage image — build once (ia-agent), reuse for te/dd/ca.
  # Parallel `build` blocks targeting the same tag cause Buildx export races:
  # "image aml/a2a-stage:dev: already exists".
  ia-agent:
    profiles: ["a2a"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.a2a-stage
    image: aml/a2a-stage:dev
    container_name: aml-ia-agent
    restart: unless-stopped
    environment:
      AML_A2A_STAGE: INITIAL_ASSESSMENT
      AML_A2A_PUBLIC_HOST: ia-agent
      AML_A2UI_ENABLED: ${AML_A2UI_ENABLED:-false}
      AML_A2UI_STAGES: ${AML_A2UI_STAGES:-INITIAL_ASSESSMENT}
      PORT: 8101
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash}
    ports:
      - "8101:8101"
    networks: [aml-net]

  te-agent:
    profiles: ["a2a"]
    image: aml/a2a-stage:dev
    container_name: aml-te-agent
    restart: unless-stopped
    depends_on:
      ia-agent:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      AML_A2A_STAGE: TRANSACTION_ENRICHMENT
      AML_A2A_PUBLIC_HOST: te-agent
      PORT: 8102
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jpass}
    ports:
      - "8102:8102"
    networks: [aml-net]

  dd-agent:
    profiles: ["a2a"]
    image: aml/a2a-stage:dev
    container_name: aml-dd-agent
    restart: unless-stopped
    depends_on:
      ia-agent:
        condition: service_started
    environment:
      AML_A2A_STAGE: DUE_DILIGENCE
      AML_A2A_PUBLIC_HOST: dd-agent
      PORT: 8103
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash}
    ports:
      - "8103:8103"
    networks: [aml-net]

  ca-agent:
    profiles: ["a2a"]
    image: aml/a2a-stage:dev
    container_name: aml-ca-agent
    restart: unless-stopped
    depends_on:
      ia-agent:
        condition: service_started
    environment:
      AML_A2A_STAGE: CASE_ANALYSIS
      AML_A2A_PUBLIC_HOST: ca-agent
      PORT: 8104
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash}
    ports:
      - "8104:8104"
    networks: [aml-net]

  # Sprint 7 — AML host agent (A2A front door → orchestrator).
  aml-host:
    profiles: ["a2a"]
    image: aml/a2a-stage:dev
    container_name: aml-aml-host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      ia-agent:
        condition: service_started
    environment:
      AML_A2A_PUBLIC_HOST: aml-host
      PORT: 8100
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jpass}
      AML_AGENT_TRANSPORT_DEFAULT: ${AML_AGENT_TRANSPORT_DEFAULT:-in_process}
      AML_A2A_INITIAL_ASSESSMENT_URL: ${AML_A2A_INITIAL_ASSESSMENT_URL:-}
      AML_A2A_TRANSACTION_ENRICHMENT_URL: ${AML_A2A_TRANSACTION_ENRICHMENT_URL:-}
      AML_A2A_DUE_DILIGENCE_URL: ${AML_A2A_DUE_DILIGENCE_URL:-}
      AML_A2A_CASE_ANALYSIS_URL: ${AML_A2A_CASE_ANALYSIS_URL:-}
      AML_A2A_TIMEOUT_SECONDS: ${AML_A2A_TIMEOUT_SECONDS:-600}
      AML_TOOL_GATEWAY_SECRET: ${AML_TOOL_GATEWAY_SECRET:-aml-dev-tool-gateway-secret}
      AML_TOOL_GATEWAY_BASE_URL: ${AML_TOOL_GATEWAY_BASE_URL:-http://backend:8000}
      AML_A2UI_ENABLED: ${AML_A2UI_ENABLED:-false}
      AML_A2UI_STAGES: ${AML_A2UI_STAGES:-INITIAL_ASSESSMENT}
    ports:
      - "8100:8100"
    command:
      - sh
      - -c
      - uvicorn backend.aml.agents.a2a.host_app:get_app --factory --host 0.0.0.0 --port $${PORT:-8100} --proxy-headers --forwarded-allow-ips '*'
    networks: [aml-net]

networks:
  aml-net:
    name: aml-net
    driver: bridge

volumes:
  aml-pgdata:
  aml-neo4jdata:
  aml-neo4jlogs:
