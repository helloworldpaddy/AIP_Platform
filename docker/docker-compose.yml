# Full AML Investigation Agentic Platform stack.
#
# Quick start (from the repo root):
#     cp docker/.env.example docker/.env
#     # edit docker/.env to set GOOGLE_API_KEY at minimum
#     docker compose -f docker/docker-compose.yml --env-file docker/.env up --build
#
# Services:
#   * postgres   pgvector/pg16 — both the RAG `documents` table and the
#                `aml.*` schema, initialized once on first boot from the
#                bind-mounted .sql files in docker/init-db/.
#   * neo4j      Investigation graph (constraints applied by neo4j-init).
#   * backend    FastAPI + the four-agent orchestrator (uvicorn).
#   * frontend   Vite-built React SPA served by nginx; nginx also proxies
#                /api/* → backend over the compose network.
#   * redis      Optional cache (profile: cache).
#
# Profiles:
#     docker compose --profile cache  up   # also runs redis
#
# Networks:
#   Everything sits on the default `aml-net` bridge so services resolve each
#   other by container name (e.g. `backend`, `postgres`, `neo4j`).

name: aml-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      IVFFLAT_LISTS: ${IVFFLAT_LISTS:-100}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aml-pgdata:/var/lib/postgresql/data
      # Schema bootstrap.  The .sh wrappers run on first init only (when the
      # data dir is empty); they call psql against POSTGRES_DB.
      - ./init-db/01-rag-schema.sh:/docker-entrypoint-initdb.d/01-rag-schema.sh:ro
      - ./init-db/02-aml-schema.sh:/docker-entrypoint-initdb.d/02-aml-schema.sh:ro
      # The .sql sources live elsewhere in the repo; surface them under /sql
      # so the init scripts can read them with stable paths.
      - ../agents/rag_agent/db/schema.sql:/sql/rag-schema.sql:ro
      - ../backend/aml/db/schema.sql:/sql/aml-schema.sql:ro
      - ../backend/aml/db/schema_case_scenarios_transactions.sql:/sql/aml-case-scenarios-txns.sql:ro
      - ../backend/aml/db/schema_services_swift.sql:/sql/aml-services-swift.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aml-net]

  neo4j:
    image: neo4j:5.20-community
    container_name: aml-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jpass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP:-512m}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # browser
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # bolt
    volumes:
      - aml-neo4jdata:/data
      - aml-neo4jlogs:/logs
    healthcheck:
      # cypher-shell ships in the image; a trivial RETURN proves the DB is up.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [aml-net]

  # One-shot job: applies the constraints in init-neo4j/ then exits 0.  Compose
  # restarts it cleanly on `up` even after the data dir is populated; the
  # IF NOT EXISTS guards make every re-run a no-op.
  neo4j-init:
    image: neo4j:5.20-community
    container_name: aml-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jpass}
    volumes:
      - ./init-neo4j:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        password="$${NEO4J_AUTH#*/}"
        for f in /init/*.cypher; do
          echo "[neo4j-init] applying $$f"
          cypher-shell -a bolt://neo4j:7687 -u neo4j -p "$$password" --file "$$f"
        done
        echo "[neo4j-init] done"
    restart: "no"
    networks: [aml-net]

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: aml/backend:dev
    container_name: aml-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # Database (asyncpg pool) -------------------------------------------------
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-2}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
      # Gemini ----------------------------------------------------------------
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-2.5-flash}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      # Neo4j -----------------------------------------------------------------
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jpass}
      # API + observability --------------------------------------------------
      AML_CORS_ORIGINS: ${AML_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # Requeue RUNNING rows only after this many minutes (LLM steps can be slow).
      AML_STALE_RUNNING_MINUTES: ${AML_STALE_RUNNING_MINUTES:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [aml-net]

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Empty → SPA emits requests to /api/*, nginx proxies to backend.
        VITE_API_BASE_URL: ""
    image: aml/frontend:dev
    container_name: aml-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [aml-net]

  redis:
    image: redis:7-alpine
    container_name: aml-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles: ["cache"]
    networks: [aml-net]

networks:
  aml-net:
    name: aml-net
    driver: bridge

volumes:
  aml-pgdata:
  aml-neo4jdata:
  aml-neo4jlogs:
