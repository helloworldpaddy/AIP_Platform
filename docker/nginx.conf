# Frontend nginx config:
#   * Serves the built SPA from /usr/share/nginx/html with history-mode fallback.
#   * Proxies /api/* to the FastAPI backend over the compose network.
#
# Use Docker's embedded DNS + a variable in proxy_pass so the backend IP is
# re-resolved after `docker compose up` recreates the backend container.
# (A static `upstream { server backend:8000; }` caches the old IP → 502.)

server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Strip ANSI/Server header noise; gzip the JS/CSS/HTML for free.
    server_tokens off;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    # Static SPA --------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset bundles can be cached aggressively.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Tiny health endpoint so docker can probe nginx without hitting the SPA.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend proxy -----------------------------------------------------------
    # Frontend is built with VITE_API_BASE_URL="" so all requests hit /api/*.
    # rewrite strips /api — then proxy_pass with variable host (no URI) so nginx
    # re-resolves `backend` via Docker DNS after container recreate.
    location /api/ {
        # `set` must run before `rewrite ... break` (break stops later rewrite-phase directives).
        set $aml_backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $aml_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # AML host agent (A2A + A2UI) — Sprint 8; requires compose profile `a2a`.
    location /a2a/ {
        set $aml_a2a_upstream http://aml-host:8100;
        rewrite ^/a2a/(.*)$ /$1 break;
        proxy_pass         $aml_a2a_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Analyst-Id      $http_x_analyst_id;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 600s;
    }

    # SPA shell (HTML). Do not cache aggressively — stale index.html after a
    # Vite rebuild still points at old hashed /assets/*.js → blank white screen.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
