# Frontend nginx config:
#   * Serves the built SPA from /usr/share/nginx/html with history-mode fallback.
#   * Proxies /api/* to the FastAPI backend over the compose network.

upstream aml_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Strip ANSI/Server header noise; gzip the JS/CSS/HTML for free.
    server_tokens off;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    # Static SPA --------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset bundles can be cached aggressively.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Tiny health endpoint so docker can probe nginx without hitting the SPA.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend proxy -----------------------------------------------------------
    # Frontend is built with VITE_API_BASE_URL="" so all requests hit /api/*.
    location /api/ {
        proxy_pass         http://aml_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # SPA history-mode fallback for everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
